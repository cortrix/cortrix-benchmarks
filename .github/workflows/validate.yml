name: Validate benchmark evidence

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: benchmark-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest -q benchmarks/beir-retrieval-quality/tests

      - name: Run the metric self-test
        run: python benchmarks/beir-retrieval-quality/runner/run_benchmark.py selftest

      - name: Validate the published bundle
        run: >-
          python benchmarks/beir-retrieval-quality/tools/validate_release_candidate.py
          results/published/beir-three-full-corpus-2026-07-v1

      - name: Verify the checksum inventory
        working-directory: results/published/beir-three-full-corpus-2026-07-v1
        run: sha256sum -c checksums.sha256
